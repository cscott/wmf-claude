variables:
  GIT_SUBMODULE_STRATEGY: recursive

stages:
  - test

test:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq wget curl jq python3 libdbus-1-3 >/dev/null 2>&1
    # Pinned: nono 0.51+ regressed `nono run --workdir --allow-cwd -- <cmd>` on
    # Linux (cat/ls/touch/env all exit non-zero in CI; works on macOS 0.52.0).
    # Revisit once upstream lands a fix. See job 820086 for the failure pattern.
    - VERSION=0.50.0
    - ARCH=$(dpkg --print-architecture)
    - wget -q "https://github.com/always-further/nono/releases/download/v${VERSION}/nono-cli_${VERSION}_${ARCH}.deb"
    - dpkg -i "nono-cli_${VERSION}_${ARCH}.deb"
    # The claude-code base profile lives in the always-further/claude pack as of nono 0.44.
    - nono pull always-further/claude --silent
  script:
    - ./tests/test-templates.sh
    - ./tests/test-profile.sh
