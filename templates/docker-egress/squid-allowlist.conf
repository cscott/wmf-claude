# wmf-claude egress allowlist for the egress-proxy sidecar
# (templates/docker-egress/egress-allowlist.yml).
#
# Covers what `composer install` and `npm install` fetch for MediaWiki
# development: packagist, github release/archive hosts, the npm registry, and
# Wikimedia hosts. Everything else is denied. Trim or extend for your project;
# keep the final "deny all".
#
# Keep this file OUTSIDE the checkout (default: ~/.config/wmf-claude/) so the
# agent cannot edit it. Squid reads it only at start/reload, which the agent
# cannot trigger through the broker.
http_port 3128

acl allowed_dst dstdomain .packagist.org
acl allowed_dst dstdomain .getcomposer.org
acl allowed_dst dstdomain .github.com
acl allowed_dst dstdomain .githubusercontent.com
acl allowed_dst dstdomain registry.npmjs.org
acl allowed_dst dstdomain .wikimedia.org

acl SSL_ports port 443
acl CONNECT method CONNECT

# HTTPS tunnels only to 443, and only to allowed hosts.
http_access deny CONNECT !SSL_ports
http_access allow allowed_dst
http_access deny all

# The proxy is a gate, not a cache.
cache deny all
access_log stdio:/dev/stdout
